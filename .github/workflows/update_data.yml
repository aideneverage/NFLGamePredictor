name: Weekly NFL Data Refresh

on:
  schedule:
    # Runs every Wednesday at 09:00 UTC (morning US time)
    # Cron format: minute hour day-of-month month day-of-week (3 = Wednesday)
    - cron: '0 9 * * 3'
  workflow_dispatch: # Lets you manually trigger it anytime via a button on GitHub

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the action permission to push back to your repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Pipeline
        run: |
          python src/data_pipeline.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/model_ready_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data refresh [skip ci]" && git push)